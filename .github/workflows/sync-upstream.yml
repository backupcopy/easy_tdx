name: 自动同步上游 easy_tdx
# 触发条件：每天执行一次；支持网页手动点击运行
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 添加上游原仓库地址
        run: |
          git remote add upstream https://github.com/awayings/easy_tdx.git
          git fetch upstream

      - name: 合并上游 main 分支代码
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git merge upstream/main --allow-unrelated-histories || echo "合并发生冲突，需要人工处理"

      - name: 推送合并结果到自己Fork仓库
        run: |
          git push origin main
